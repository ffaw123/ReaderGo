services:
  # 带 pgvector 扩展的主数据存储。
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: readergo
      POSTGRES_USER: readergo
      POSTGRES_PASSWORD: readergo
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readergo -d readergo"]
      interval: 5s
      timeout: 5s
      retries: 10
  # 离线检索测评专用数据库；profile 避免普通线上启动命令创建该容器。
  postgres-eval:
    profiles: ["eval"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: readergo_eval
      POSTGRES_USER: readergo
      POSTGRES_PASSWORD: readergo
    ports: ["5433:5432"]
    # 使用具名卷避免每次重建评测容器都遗留随机名称的匿名卷。
    volumes:
      - postgres_eval_data:/var/lib/postgresql/data
      - ${RETRIEVAL_EVAL_SQL_FILE:-./docs/evaldata/retrieval_tuning_database.sql}:/docker-entrypoint-initdb.d/001_retrieval_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readergo -d readergo_eval"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    # 上传去重使用 Redis 热点缓存；数据库唯一索引仍是最终一致性保障。
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    # 本地与生产使用相同的 direct exchange / quorum queue 拓扑。
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: readergo
      RABBITMQ_DEFAULT_PASS: readergo-secret
      RABBITMQ_DEFAULT_VHOST: readergo
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    # 兼容 S3 的对象存储，用于原视频、音频、帧和短片段。
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: readergo
      MINIO_ROOT_PASSWORD: readergo
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  # 为浏览器直传分片配置 CORS，并暴露完成 multipart upload 必需的 ETag。
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set readergo http://minio:9000 readergo readergo; do sleep 1; done;
      mc mb --ignore-existing readergo/videos;
      mc cors set readergo/videos /config/cors.json
    volumes: ["./docker/minio-cors.json:/config/cors.json:ro"]
volumes:
  postgres_data:
  postgres_eval_data:
    # 固定名称供评测脚本精确清理，避免 down -v 误删其他业务卷。
    name: readergo_postgres_eval_data
  minio_data:
  rabbitmq_data:
