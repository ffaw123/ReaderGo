services:
  # 带 pgvector 扩展的主数据存储。
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: readergo
      POSTGRES_USER: readergo
      POSTGRES_PASSWORD: readergo
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readergo -d readergo"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    # 预留给进度缓存、限流、会话和分布式锁。
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    # 本地与生产使用相同的 direct exchange / quorum queue 拓扑。
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: readergo
      RABBITMQ_DEFAULT_PASS: readergo-secret
      RABBITMQ_DEFAULT_VHOST: readergo
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    # 兼容 S3 的对象存储，用于原视频、音频、帧和短片段。
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: readergo
      MINIO_ROOT_PASSWORD: readergo
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  # 为浏览器直传分片配置 CORS，并暴露完成 multipart upload 必需的 ETag。
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set readergo http://minio:9000 readergo readergo-secret; do sleep 1; done;
      mc mb --ignore-existing readergo/videos;
      mc cors set readergo/videos /config/cors.json
    volumes: ["./docker/minio-cors.json:/config/cors.json:ro"]
  # PaddleOCR 以独立 HTTP 服务运行；宿主机 Worker 通过 localhost:8081/ocr 调用。
  paddleocr:
    build:
      context: ./docker/paddleocr
    ports: ["8081:8080"]
    environment:
      # 跳过启动时的多模型源连通性探测，模型仍会在缓存缺失时正常下载。
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      # 与 Go Worker 的 OCR_CONCURRENCY 默认值一致，每路请求使用独立推理实例。
      OCR_ENGINE_WORKERS: "2"
    # 持久化自动下载的模型，避免重建容器后重复下载。
    volumes: ["paddleocr_models:/root/.paddlex"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  paddleocr_models:
